                  - !Sub '${ApplicationResourcePrefix}-production-*#tag#*'
          - Effect: Allow
            Action: [ logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents ]
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ApplicationResourcePrefix}-production-*:*'
          - Effect: Allow
            Action: rum:PutRumEvents
            Resource: !Sub 'arn:${AWS::Partition}:rum:${AWS::Region}:${AWS::AccountId}:appmonitor/${ApplicationResourcePrefix}-production-*'
          - Effect: Allow
            Action: xray:PutTraceSegments
            Resource: '*'

  productionApplicationDeploymentPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
