AWSTemplateFormatVersion: '2010-09-09'
Description: Shared regional storage for bootstrap templates and deployment artifacts.

Parameters:
  RepositoryPrefix:
    Type: String
    Default: slongdotexe
    AllowedPattern: '[a-z][a-z0-9-]{0,24}[a-z0-9]'

Resources:
  Templates:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${RepositoryPrefix}-templates-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: CleanOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
  TemplatesPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Templates
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: LambdaWebFunctionArtifacts
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: [s3:GetObject, s3:GetObjectVersion]
            Resource:
              - !Sub '${Templates.Arn}/${RepositoryPrefix}/development/*'
              - !Sub '${Templates.Arn}/${RepositoryPrefix}/production/*'
              - !Sub '${Templates.Arn}/${RepositoryPrefix}/preview/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt Templates.Arn, !Sub '${Templates.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  TemplateBucket:
    Value: !Ref Templates
