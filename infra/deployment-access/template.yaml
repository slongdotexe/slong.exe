            Condition:
              StringEquals:
                aws:ResourceTag/DeploymentEnvironment: '${aws:PrincipalTag/DeploymentEnvironment}'
              StringLike:
                aws:ResourceTag/Project: !Ref ApplicationResourcePrefix
          - Effect: Allow
            Action: [ route53:CreateHostedZone, route53:GetHostedZone, route53:ListHostedZones, route53:ListHostedZonesByName, route53:ListTagsForResource, route53:ChangeTagsForResource ]
            Resource: '*'
          - Effect: Allow
            Action: route53:ChangeResourceRecordSets
            Resource: !Sub 'arn:${AWS::Partition}:route53:::hostedzone/*'
            Condition:
              ForAllValues:StringLike:
                route53:ChangeResourceRecordSetsNormalizedRecordNames: !Ref DevelopmentRecordNames
              ForAllValues:StringEquals:
                route53:ChangeResourceRecordSetsRecordTypes: [ A, AAAA, CNAME ]
              StringEquals:
                aws:PrincipalTag/DeploymentEnvironment: [ development, ephemeral ]
          - Effect: Allow
            Action: route53:GetChange
            Resource: !Sub 'arn:${AWS::Partition}:route53:::change/*'

