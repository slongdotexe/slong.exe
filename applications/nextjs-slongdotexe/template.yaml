AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: NextJS application with a nested cache stack or shared preview cache.

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues: [development, production, ephemeral]
  PreviewName:
    Type: String
    Default: ''
    AllowedPattern: '(^$|pr-[0-9]+)'
    MaxLength: 64
  SharedCacheStackName:
    Type: String
    Default: sam-nextjs-slongdotexe-preview-cache
    Description: Separate cache stack in this region, used only by PR previews.
  PreviewParameterPrefix:
    Type: String
    Default: /slongdotexe/ephemeral/cdn
    AllowedPattern: '/[a-zA-Z0-9_./-]+[a-zA-Z0-9_-]'
  LogLevel:
    Type: String
    Default: INFO
  ApplicationPath:
    Type: String
    Default: applications/nextjs-slongdotexe
  EndpointName:
    Type: String
    Default: prod
    AllowedPattern: '[a-zA-Z0-9_-]{1,64}'
    Description: Stable endpoint name. Keep prod for existing stacks; changing it replaces the origin hostname.
  EndpointAuthType:
    Type: String
    Default: IamAuth
    AllowedValues: [IamAuth, ApplicationManaged]
    Description: Use IamAuth for CloudFront, including bootstrap before its distribution ID is available.
  CloudFrontDistributionId:
    Type: String
    Default: ''
    AllowedPattern: '(^$|E[A-Z0-9]+)'
    Description: Leave empty during bootstrap; provide the deployed CDN ID to authorize access.
  RumDomainName:
    Type: String
    Default: ''
    AllowedPattern: '(^$|[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+)'
    Description: Public browser hostname without scheme or path. Leave empty to disable RUM.
  RumSessionSampleRate:
    Type: Number
    Default: 0.1
    MinValue: 0
    MaxValue: 1
Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  IsPreview: !Not [!Equals [!Ref PreviewName, '']]
  OwnsCache: !Equals [!Ref PreviewName, '']
  HasDistributionId: !Or [!Condition IsPreview, !Not [!Equals [!Ref CloudFrontDistributionId, '']]]
  EnableRum: !And [!Condition OwnsCache, !Not [!Equals [!Ref RumDomainName, '']]]

Rules:
  PreviewConfiguration:
    RuleCondition: !Not [!Equals [!Ref PreviewName, '']]
    Assertions:
      - Assert: !Equals [!Ref Environment, ephemeral]
        AssertDescription: PR previews must use Environment=ephemeral.
      - Assert: !Equals [!Ref EndpointAuthType, IamAuth]
        AssertDescription: PR preview endpoints must use IAM authentication.

Resources:
  RumIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Condition: EnableRum
    Properties:
      AllowUnauthenticatedIdentities: true

  RumGuestRole:
    Type: AWS::IAM::Role
    Condition: EnableRum
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref RumIdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: unauthenticated
      Policies:
        - PolicyName: rum-publish-events
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rum:PutRumEvents
                Resource: !Sub arn:${AWS::Partition}:rum:${AWS::Region}:${AWS::AccountId}:appmonitor/${AWS::StackName}-rum

  RumIdentityPoolRoles:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Condition: EnableRum
    Properties:
      IdentityPoolId: !Ref RumIdentityPool
      Roles:
        unauthenticated: !GetAtt RumGuestRole.Arn

  RumAppMonitor:
    Type: AWS::RUM::AppMonitor
    Condition: EnableRum
    Properties:
      Name: !Sub ${AWS::StackName}-rum
      Domain: !Ref RumDomainName
      CwLogEnabled: false
      AppMonitorConfiguration:
        IdentityPoolId: !Ref RumIdentityPool
        GuestRoleArn: !GetAtt RumGuestRole.Arn
        AllowCookies: false
        EnableXRay: false
        SessionSampleRate: !Ref RumSessionSampleRate
        Telemetries: [errors, performance, http]

  CacheStack:
    Type: AWS::Serverless::Application
    Condition: OwnsCache
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      Location: out/cache/template.yaml
      Parameters:
        Environment: !Ref Environment
        CacheNamespace: !Ref AWS::StackName

  WebAppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: nextjs-slongdotexe-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                # Web Functions write locally before centralizing, even in HomeRegion.
                Resource:
                  - !GetAtt WebAppLogGroup.Arn
                  - !GetAtt WebAppLocalLogGroup.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !If
                  - IsPreview
                  - !Sub
                    - '${BucketArn}/${Prefix}${PreviewName}/*'
                    - BucketArn:
                        Fn::ImportValue: !Sub ${SharedCacheStackName}-BucketArn
                      Prefix:
                        Fn::ImportValue: !Sub ${SharedCacheStackName}-PreviewPrefix
                  - !Sub ${CacheStack.Outputs.BucketArn}/${AWS::StackName}/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !If
                  - IsPreview
                  - Fn::ImportValue: !Sub ${SharedCacheStackName}-BucketArn
                  - !GetAtt CacheStack.Outputs.BucketArn
                Condition:
                  StringLike:
                    s3:prefix: !If
                      - IsPreview
                      - !Sub
                        - '${Prefix}${PreviewName}/*'
                        - Prefix:
                            Fn::ImportValue: !Sub ${SharedCacheStackName}-PreviewPrefix
                      - !Sub '${AWS::StackName}/*'
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !If
                  - IsPreview
                  - Fn::ImportValue: !Sub ${SharedCacheStackName}-TagTableArn
                  - !GetAtt CacheStack.Outputs.TagTableArn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - !If
                        - IsPreview
                        - !Sub
                          - '${Prefix}${PreviewName}#tag#*'
                          - Prefix:
                              Fn::ImportValue: !Sub ${SharedCacheStackName}-PreviewPrefix
                        - !Sub '${AWS::StackName}#tag#*'
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !If
                  - IsPreview
                  - Fn::ImportValue: !Sub ${SharedCacheStackName}-QueueArn
                  - !GetAtt CacheStack.Outputs.QueueArn
              - Effect: Allow
                Action: xray:PutTraceSegments
                Resource: '*'

  WebAppLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-web
      RetentionInDays: 90

  WebAppLocalLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      LogGroupName: !Sub ${WebAppLogGroup}.local
      RetentionInDays: 90

  WebAppFunction:
    Type: AWS::Serverless::WebFunction
    Properties:
      # Web Function names are account-wide, so include the region as well as the stack.
      FunctionName: !Sub ${AWS::StackName}-${AWS::Region}-web
      Runtime: nodejs24.x
      CodeUri: out/web-function/
      EntryPoint: !Sub ${ApplicationPath}/server.js
      AuthType: !Ref EndpointAuthType
      EndpointName: !If [IsPreview, !Ref PreviewName, !Ref EndpointName]
      EndpointType: HomeRegion
      AutoDeploymentMode: LatestRevision
      ExecutionRoleArn: !GetAtt WebAppRole.Arn
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref WebAppLogGroup
        ApplicationLogLevel: !Ref LogLevel
        SystemLogLevel: INFO
      EnvironmentVariables:
        NODE_OPTIONS: !Sub --import ./${ApplicationPath}/web-function-entrypoint.mts
        OTEL_SERVICE_NAME: !Sub ${AWS::StackName}-web
        OTEL_METRICS_EXPORTER: none
        OTEL_LOGS_EXPORTER: none
        OTEL_TRACES_EXPORTER: otlp
        OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: !Sub https://xray.${AWS::Region}.amazonaws.com/v1/traces
        OTEL_TRACES_SAMPLER: !If [IsProduction, parentbased_traceidratio, !Ref 'AWS::NoValue']
        OTEL_TRACES_SAMPLER_ARG: !If [IsProduction, '0.05', !Ref 'AWS::NoValue']
        OTEL_RESOURCE_ATTRIBUTES: !Sub 'deployment.environment.name=${Environment},cloud.region=${AWS::Region}'
        CACHE_BUCKET_NAME: !If
          - IsPreview
          - Fn::ImportValue: !Sub ${SharedCacheStackName}-BucketName
          - !GetAtt CacheStack.Outputs.BucketName
        CACHE_TABLE_NAME: !If
          - IsPreview
          - Fn::ImportValue: !Sub ${SharedCacheStackName}-TagTableName
          - !GetAtt CacheStack.Outputs.TagTableName
        CACHE_KEY_PREFIX: !If
          - IsPreview
          - !Sub
            - '${Prefix}${PreviewName}'
            - Prefix:
                Fn::ImportValue: !Sub ${SharedCacheStackName}-PreviewPrefix
          - !Ref AWS::StackName
        CACHE_REVALIDATION_QUEUE_URL: !If
          - IsPreview
          - Fn::ImportValue: !Sub ${SharedCacheStackName}-QueueUrl
          - !GetAtt CacheStack.Outputs.QueueUrl
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !Ref LogLevel
        RUM_APP_MONITOR_ID: !If [EnableRum, !GetAtt RumAppMonitor.Id, !Ref 'AWS::NoValue']
        RUM_IDENTITY_POOL_ID: !If [EnableRum, !Ref RumIdentityPool, !Ref 'AWS::NoValue']
        RUM_REGION: !If [EnableRum, !Ref 'AWS::Region', !Ref 'AWS::NoValue']
        RUM_SESSION_SAMPLE_RATE: !Sub '${RumSessionSampleRate}'
      Tags:
        Environment: !Ref Environment

  WebAppCloudFrontPolicy:
    Type: AWS::Lambda::ResourcePolicy
    Condition: HasDistributionId
    Properties:
      ResourceArn: !Ref WebAppFunction
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: lambda:InvokeWebFunctionEndpoint
            Resource: !If
              - IsPreview
              - !Sub ${WebAppFunction}/endpoint/${PreviewName}
              - !Sub ${WebAppFunction}/endpoint/${EndpointName}
            Condition:
              StringEquals:
                aws:SourceArn: !If
                  - IsPreview
                  - !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/{{resolve:ssm:${PreviewParameterPrefix}/distribution-id}}'
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}

  PreviewRoutingLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsPreview
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-preview-routing
      RetentionInDays: 30

  PreviewRoutingRole:
    Type: AWS::IAM::Role
    Condition: IsPreview
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: preview-routing
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudfront-keyvaluestore:DescribeKeyValueStore
                  - cloudfront-keyvaluestore:GetKey
                  - cloudfront-keyvaluestore:PutKey
                  - cloudfront-keyvaluestore:DeleteKey
                Resource: !Sub '{{resolve:ssm:${PreviewParameterPrefix}/routing-store-arn}}'
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PreviewParameterPrefix}/routing-store-arn'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PreviewParameterPrefix}/preview-domain'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt PreviewRoutingLogGroup.Arn

  PreviewRoutingFunction:
    Type: AWS::Serverless::Function
    Condition: IsPreview
    Properties:
      FunctionName: !Sub ${AWS::StackName}-preview-routing
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt PreviewRoutingRole.Arn
      Timeout: 120
      MemorySize: 256
      CodeUri: out/preview-routing-resource/
      LoggingConfig:
        LogGroup: !Ref PreviewRoutingLogGroup

  PreviewRouting:
    Type: Custom::PreviewRouting
    Condition: IsPreview
    DependsOn: WebAppCloudFrontPolicy
    Properties:
      ServiceToken: !GetAtt PreviewRoutingFunction.Arn
      ServiceTimeout: 180
      ParameterPrefix: !Ref PreviewParameterPrefix
      PreviewName: !Ref PreviewName
      DomainName: !GetAtt WebAppFunctionEndpoint.DomainName
      RevisionId: !GetAtt WebAppFunctionRevision.RevisionId

Outputs:
  RumAppMonitorName:
    Condition: EnableRum
    Value: !Ref RumAppMonitor
  RumAppMonitorId:
    Condition: EnableRum
    Value: !GetAtt RumAppMonitor.Id
  RumIdentityPoolId:
    Condition: EnableRum
    Value: !Ref RumIdentityPool
  WebAppFunctionArn:
    Value: !Ref WebAppFunction
  WebAppEndpointName:
    Value: !If [IsPreview, !Ref PreviewName, !Ref EndpointName]
  WebAppOriginDomainName:
    Description: Regional CloudFront origin hostname, without scheme or path.
    Value: !GetAtt WebAppFunctionEndpoint.DomainName
  IncrementalCacheBucketName:
    Condition: OwnsCache
    Value: !GetAtt CacheStack.Outputs.BucketName
  CacheTagTableName:
    Condition: OwnsCache
    Value: !GetAtt CacheStack.Outputs.TagTableName
  CacheRevalidationQueueUrl:
    Condition: OwnsCache
    Value: !GetAtt CacheStack.Outputs.QueueUrl
  CacheRevalidationDeadLetterQueueUrl:
    Condition: OwnsCache
    Value: !GetAtt CacheStack.Outputs.DeadLetterQueueUrl
  WebAppUrl:
    Value: !Sub https://${WebAppFunctionEndpoint.DomainName}
  WebAppLogGroupName:
    Value: !Ref WebAppLogGroup
  WebAppLocalLogGroupName:
    Description: Regional logs available before centralization completes.
    Value: !Ref WebAppLocalLogGroup
  PreviewUrl:
    Condition: IsPreview
    Value: !GetAtt PreviewRouting.PreviewUrl
