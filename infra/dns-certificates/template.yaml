AWSTemplateFormatVersion: '2010-09-09'
Description: Public DNS delegation and CloudFront viewer certificate; deploy in us-east-1.

Parameters:
  DomainName:
    Type: String
    AllowedPattern: '[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+'
    Description: development.seanlong.me for development and ephemeral, or seanlong.me for production.
  CreateHostedZone:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Create the shared delegated development zone. Ephemeral reuses it; production DNS stays on Cloudflare.
  IncludeWildcard:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Include first-level subdomains in the certificate for ephemeral previews.

Conditions:
  UseRoute53: !Equals [!Ref CreateHostedZone, 'true']
  UseWildcard: !Equals [!Ref IncludeWildcard, 'true']

Resources:
  HostedZone:
    Type: AWS::Route53::HostedZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Condition: UseRoute53
    Properties:
      Name: !Ref DomainName

  ViewerCertificate:
    Type: AWS::CertificateManager::Certificate
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: !If [UseWildcard, [!Sub '*.${DomainName}'], !Ref 'AWS::NoValue']
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - UseRoute53
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZone
        - !Ref 'AWS::NoValue'

Outputs:
  DomainName:
    Value: !Ref DomainName
    Export:
      Name: !Sub ${AWS::StackName}-DomainName
  CertificateArn:
    Value: !Ref ViewerCertificate
    Export:
      Name: !Sub ${AWS::StackName}-CertificateArn
  HostedZoneId:
    Condition: UseRoute53
    Value: !Ref HostedZone
    Export:
      Name: !Sub ${AWS::StackName}-HostedZoneId
  NameServers:
    Condition: UseRoute53
    Description: Publish these as DNS-only NS records for the subdomain in Cloudflare before certificate validation can complete.
    Value: !Join [',', !GetAtt HostedZone.NameServers]
