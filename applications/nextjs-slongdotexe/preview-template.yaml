AWSTemplateFormatVersion: '2010-09-09'
Description: PR revision and pinned endpoint on the development Web Function.

Parameters:
  DevelopmentStackName:
    Type: String
    Default: sam-nextjs-slongdotexe-development
  PreviewName:
    Type: String
    AllowedPattern: 'pr-[0-9]+'
    MaxLength: 64
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  CodeVersion:
    Type: String
  ApplicationPath:
    Type: String
    Default: applications/nextjs-slongdotexe

Resources:
  PreviewRevision:
    Type: AWS::Lambda::WebFunctionRevision
    Properties:
      FunctionName:
        Fn::ImportValue: !Sub ${DevelopmentStackName}-PreviewWebFunctionArn
      BuildConfig:
        CodeConfig:
          S3Object:
            Bucket: !Ref CodeBucket
            Key: !Ref CodeKey
            VersionId: !Ref CodeVersion
        RuntimeConfig:
          Runtime: nodejs24.x
      ServiceConfig:
        ExecutionRoleArn:
          Fn::ImportValue: !Sub ${DevelopmentStackName}-PreviewRuntimeRoleArn
        TimeoutSeconds: 30
        EnvironmentVariables:
          AWS_LAMBDA_NODEJS_ENTRYPOINT: !Sub ${ApplicationPath}/server.js
          NODE_OPTIONS: !Sub --import ./${ApplicationPath}/web-function-entrypoint.mts
          OTEL_SERVICE_NAME: !Sub ${DevelopmentStackName}-${PreviewName}-web
          OTEL_METRICS_EXPORTER: none
          OTEL_LOGS_EXPORTER: none
          OTEL_TRACES_EXPORTER: otlp
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: !Sub https://xray.${AWS::Region}.amazonaws.com/v1/traces
          OTEL_RESOURCE_ATTRIBUTES: !Sub 'deployment.environment.name=ephemeral,cloud.region=${AWS::Region}'
          CACHE_BUCKET_NAME:
            Fn::ImportValue: !Sub ${DevelopmentStackName}-PreviewCacheBucketName
          CACHE_TABLE_NAME:
            Fn::ImportValue: !Sub ${DevelopmentStackName}-PreviewCacheTagTableName
          CACHE_KEY_PREFIX: !Sub ${DevelopmentStackName}/previews/${PreviewName}
          CACHE_REVALIDATION_QUEUE_URL:
            Fn::ImportValue: !Sub ${DevelopmentStackName}-PreviewRevalidationQueueUrl
          ENVIRONMENT: ephemeral
          LOG_LEVEL: DEBUG
        TelemetryConfig:
          LoggingConfig:
            LogGroup:
              Fn::ImportValue: !Sub ${DevelopmentStackName}-PreviewWebLogGroupName
            ApplicationLogLevel: DEBUG
            SystemLogLevel: INFO
  PreviewEndpoint:
    Type: AWS::Lambda::WebFunctionEndpoint
    Properties:
      FunctionName:
        Fn::ImportValue: !Sub ${DevelopmentStackName}-PreviewWebFunctionArn
      EndpointName: !Ref PreviewName
      EndpointType: HomeRegion
      AuthType: IamAuth
      RevisionWeights:
        - RevisionId: !GetAtt PreviewRevision.RevisionId
          Weight: 100

Outputs:
  WebAppOriginDomainName:
    Value: !GetAtt PreviewEndpoint.DomainName
  WebAppEndpointName:
    Value: !Ref PreviewName
  PreviewRevisionId:
    Value: !GetAtt PreviewRevision.RevisionId
  WebAppUrl:
    Value: !Sub https://${PreviewEndpoint.DomainName}
