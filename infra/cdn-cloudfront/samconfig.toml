version = 0.1

[development.deploy.parameters]
stack_name = "sam-nextjs-slongdotexe-development-cdn"
profile = "slongdotexe"
region = "us-east-1"
resolve_s3 = true
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
no_fail_on_empty_changeset = true
confirm_changeset = false

