                Resource: '*'

  PreviewPipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${RepositoryPrefix}-preview-app-deploy'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateGitHubOidcProvider, !Ref GitHubOidcProvider, !Ref ExistingGitHubOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:environment:preview'
      Policies:
        - PolicyName: DeployPreview
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [cloudformation:CreateChangeSet, cloudformation:DeleteStack]
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApplicationResourcePrefix}-pr-*/*'
                Condition:
                  ArnEquals:
                    cloudformation:RoleArn: !GetAtt PreviewExecutionRole.Arn
              - Effect: Allow
                Action: [cloudformation:DescribeChangeSet, cloudformation:ExecuteChangeSet, cloudformation:DeleteChangeSet, cloudformation:DescribeStacks, cloudformation:DescribeStackEvents, cloudformation:GetTemplate, cloudformation:GetTemplateSummary]
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApplicationResourcePrefix}-pr-*/*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt PreviewExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Effect: Allow
                Action: [s3:GetBucketLocation, s3:GetBucketVersioning]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${Artifacts}'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${Artifacts}'
                Condition:
                  StringLike:
                    s3:prefix: !Sub '${RepositoryPrefix}/preview*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:AbortMultipartUpload, s3:ListMultipartUploadParts]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${Artifacts}/${RepositoryPrefix}/preview/*'

  PreviewInfrastructureExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${RepositoryPrefix}-preview-infra-execution'
      Tags:
        - Key: DeploymentEnvironment
          Value: ephemeral
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns: [!Ref CdnDeploymentPolicy, !Ref WafDeploymentPolicy, !Ref CdnRuntimeDeploymentPolicy]
      Policies:
        - PolicyName: SharedPreviewInfrastructure
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${Artifacts}/${RepositoryPrefix}/preview-infrastructure/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${RepositoryPrefix}-artifacts-${AWS::AccountId}-us-east-1/${RepositoryPrefix}/preview-infrastructure/*'
              - Effect: Allow
                Action: [s3:CreateBucket, s3:DeleteBucket, s3:GetBucketLocation, s3:GetBucketPolicy, s3:PutBucketPolicy, s3:DeleteBucketPolicy, s3:GetEncryptionConfiguration, s3:PutEncryptionConfiguration, s3:GetBucketPublicAccessBlock, s3:PutBucketPublicAccessBlock, s3:GetBucketTagging, s3:PutBucketTagging, s3:GetBucketVersioning, s3:GetBucketAcl, s3:GetBucketOwnershipControls]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ApplicationResourcePrefix}-preview-cache-*'
              - Effect: Allow
                Action: [dynamodb:CreateTable, dynamodb:UpdateTable, dynamodb:DeleteTable, dynamodb:DescribeTable, dynamodb:DescribeContinuousBackups, dynamodb:UpdateContinuousBackups, dynamodb:ListTagsOfResource, dynamodb:TagResource, dynamodb:UntagResource]
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ApplicationResourcePrefix}-preview-cache-*'
              - Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub 'arn:${AWS::Partition}:route53:::hostedzone/*'
                Condition:
                  ForAllValues:StringLike:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames: !Ref DevelopmentRecordNames
                  ForAllValues:StringEquals:
                    route53:ChangeResourceRecordSetsRecordTypes: [A, AAAA]
              - Effect: Allow
                Action: route53:GetChange
                Resource: !Sub 'arn:${AWS::Partition}:route53:::change/*'

  PreviewInfrastructurePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${RepositoryPrefix}-preview-infra-deploy'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateGitHubOidcProvider, !Ref GitHubOidcProvider, !Ref ExistingGitHubOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:environment:preview-infrastructure'
      Policies:
        - PolicyName: DeploySharedPreviewInfrastructure
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApplicationResourcePrefix}-preview-cache/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/${ApplicationResourcePrefix}-ephemeral-cdn/*'
                Condition:
                  ArnEquals:
                    cloudformation:RoleArn: !GetAtt PreviewInfrastructureExecutionRole.Arn
              - Effect: Allow
                Action: [cloudformation:DescribeChangeSet, cloudformation:ExecuteChangeSet, cloudformation:DeleteChangeSet, cloudformation:DescribeStacks, cloudformation:DescribeStackEvents, cloudformation:GetTemplate, cloudformation:GetTemplateSummary]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApplicationResourcePrefix}-preview-cache/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/${ApplicationResourcePrefix}-ephemeral-cdn/*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt PreviewInfrastructureExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Effect: Allow
                Action: [s3:GetBucketLocation, s3:GetBucketVersioning]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${Artifacts}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${RepositoryPrefix}-artifacts-${AWS::AccountId}-us-east-1'
              - Effect: Allow
                Action: s3:ListBucket
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${Artifacts}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${RepositoryPrefix}-artifacts-${AWS::AccountId}-us-east-1'
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub '${RepositoryPrefix}/preview-infrastructure'
                      - !Sub '${RepositoryPrefix}/preview-infrastructure/*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:AbortMultipartUpload, s3:ListMultipartUploadParts]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${Artifacts}/${RepositoryPrefix}/preview-infrastructure/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${RepositoryPrefix}-artifacts-${AWS::AccountId}-us-east-1/${RepositoryPrefix}/preview-infrastructure/*'

Outputs:
  RepositoryPrefix:
    Value: !Ref RepositoryPrefix
  ApplicationResourcePrefix:
    Value: !Ref ApplicationResourcePrefix
  PreviewInfrastructureDeployRoleArn:
    Value: !GetAtt PreviewInfrastructurePipelineRole.Arn
  PreviewInfrastructureExecutionRoleArn:
    Value: !GetAtt PreviewInfrastructureExecutionRole.Arn
  PreviewInfrastructureArtifactPrefix:
    Value: !Sub '${RepositoryPrefix}/preview-infrastructure'
  PreviewDeployRoleArn:
    Value: !GetAtt PreviewPipelineRole.Arn
  PreviewExecutionRoleArn:
    Value: !GetAtt PreviewExecutionRole.Arn
  PreviewRuntimePermissionsBoundaryArn:
    Value: !Ref PreviewRuntimePermissionsBoundary
  PreviewArtifactPrefix:
    Value: !Sub '${RepositoryPrefix}/preview'
  DevelopmentInfrastructureDeployRoleArn:
    Value: !GetAtt developmentInfrastructurePipelineRole.Arn
  DevelopmentInfrastructureExecutionRoleArn:
    Value: !GetAtt developmentInfrastructureExecutionRole.Arn
  InfrastructureRuntimePermissionsBoundaryArn:
    Value: !Ref InfrastructureRuntimePermissionsBoundary
  EdgeArtifactBucket:
    Value: !Sub '${RepositoryPrefix}-artifacts-${AWS::AccountId}-us-east-1'
  ArtifactBucket:
    Value: !Ref Artifacts
  GitHubOidcProviderArn:
    Value: !If [ CreateGitHubOidcProvider, !Ref GitHubOidcProvider, !Ref ExistingGitHubOidcProviderArn ]
  DevelopmentPipelineExecutionRoleArn:
    Value: !GetAtt developmentPipelineExecutionRole.Arn
  ProductionPipelineExecutionRoleArn:
    Value: !GetAtt productionPipelineExecutionRole.Arn
  DevelopmentCloudFormationExecutionRoleArn:
    Value: !GetAtt developmentCloudFormationExecutionRole.Arn
  ProductionCloudFormationExecutionRoleArn:
    Value: !GetAtt productionCloudFormationExecutionRole.Arn
  DevelopmentRuntimePermissionsBoundaryArn:
    Value: !Ref developmentRuntimePermissionsBoundary
  ProductionRuntimePermissionsBoundaryArn:
    Value: !Ref productionRuntimePermissionsBoundary
  DevelopmentArtifactPrefix:
    Value: !Sub ${RepositoryPrefix}/development
  ProductionArtifactPrefix:
    Value: !Sub ${RepositoryPrefix}/production
  ProductionInfrastructureDeployRoleArn:
    Value: !GetAtt productionInfrastructurePipelineRole.Arn
  ProductionInfrastructureExecutionRoleArn:
    Value: !GetAtt productionInfrastructureExecutionRole.Arn
