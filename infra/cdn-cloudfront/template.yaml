AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFront CDN and WAF for the NextJS Lambda Web Function; deploy in us-east-1.

Parameters:
  WebAppOriginDomainName:
    Type: String
    Description: WebAppOriginDomainName output from the application stack, without https:// or a path.
    AllowedPattern: '[a-zA-Z0-9.-]+\.lambda-web\.[a-z0-9-]+\.on\.aws'
  DomainName:
    Type: String
    Description: Public hostname, for example seanlong.me or development.seanlong.me.
    AllowedPattern: '[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+'
  CertificateArn:
    Type: String
    Description: Validated ACM certificate ARN from the DNS/certificate stack in us-east-1.
    AllowedPattern: 'arn:aws:acm:us-east-1:[0-9]{12}:certificate/[a-f0-9-]+'
  IncludeWildcard:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Associate *.DomainName with the common development distribution. The certificate must cover it.
  HostedZoneId:
    Type: String
    Default: ''
    Description: Existing authoritative public Route53 zone ID. Leave empty for Cloudflare DNS.
    AllowedPattern: '(^$|Z[A-Z0-9]+)'
  RoutingResourceCodeBucket:
    Type: String
    Default: unused-routing-artifacts
    Description: S3 bucket in us-east-1 containing the configuration-writer Lambda artifact. Required for previews.
  RoutingResourceCodeKey:
    Type: String
    Default: unused-routing-artifact.zip
    Description: Immutable S3 key of the configuration-writer Lambda ZIP. Required for previews.
  RateLimit:
    Type: Number
    Default: 2000
    MinValue: 10
    MaxValue: 2000000000
    Description: Maximum requests per viewer IP over a five-minute window (approximate).

Conditions:
  UseRoute53: !Not [!Equals [!Ref HostedZoneId, '']]
  EnablePreviewRouting: !Equals [!Ref IncludeWildcard, 'true']

Resources:
  PreviewRoutingStore:
    Type: AWS::CloudFront::KeyValueStore
    Condition: EnablePreviewRouting
    Properties:
      Name: !Sub ${AWS::StackName}-preview-routing

  RoutingConfigurationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Condition: EnablePreviewRouting
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-routing-configuration
      RetentionInDays: 30

  RoutingConfigurationRole:
    Type: AWS::IAM::Role
    Condition: EnablePreviewRouting
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: routing-configuration
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudfront-keyvaluestore:DescribeKeyValueStore
                  - cloudfront-keyvaluestore:GetKey
                  - cloudfront-keyvaluestore:PutKey
                  - cloudfront-keyvaluestore:DeleteKey
                Resource: !GetAtt PreviewRoutingStore.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt RoutingConfigurationLogGroup.Arn

  RoutingConfigurationFunction:
    Type: AWS::Lambda::Function
    Condition: EnablePreviewRouting
    Properties:
      FunctionName: !Sub ${AWS::StackName}-routing-configuration
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt RoutingConfigurationRole.Arn
      Timeout: 120
      MemorySize: 256
      Code:
        S3Bucket: !Ref RoutingResourceCodeBucket
        S3Key: !Ref RoutingResourceCodeKey
      LoggingConfig:
        LogGroup: !Ref RoutingConfigurationLogGroup

  RoutingConfiguration:
    Type: Custom::RoutingConfiguration
    Condition: EnablePreviewRouting
    Properties:
      ServiceToken: !GetAtt RoutingConfigurationFunction.Arn
      ServiceTimeout: 180
      StoreArn: !GetAtt PreviewRoutingStore.Arn
      Hostname: config:development-domain
      DomainName: !Ref DomainName
      RevisionId: !Ref RoutingResourceCodeKey

  PreviewRoutingFunction:
    Type: AWS::CloudFront::Function
    Condition: EnablePreviewRouting
    DependsOn: RoutingConfiguration
    Properties:
      Name: !Sub ${AWS::StackName}-preview-routing
      AutoPublish: true
      FunctionConfig:
        Comment: Route registered preview hostnames to pinned Web Function endpoints.
        Runtime: cloudfront-js-2.0
        KeyValueStoreAssociations:
          - KeyValueStoreARN: !GetAtt PreviewRoutingStore.Arn
      FunctionCode: ''

  WebAppOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-web
        OriginAccessControlOriginType: lambda
        SigningBehavior: always-amz-auth
        SigningProtocol: sigv4

  DynamicCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${AWS::StackName}-dynamic
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: false
          EnableAcceptEncodingGzip: false
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  StaticCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${AWS::StackName}-static
        MinTTL: 0
        DefaultTTL: 31536000
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: !If [EnablePreviewRouting, whitelist, none]
            Headers: !If [EnablePreviewRouting, [x-preview-cache-key], !Ref 'AWS::NoValue']
          QueryStringsConfig:
            QueryStringBehavior: none

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-security
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: SAMEORIGIN
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
            Override: true

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        SampledRequestsEnabled: false
        MetricName: !Sub ${AWS::StackName}-waf
      Rules:
        - Name: CommonRuleSet
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            SampledRequestsEnabled: false
            MetricName: CommonRuleSet
        - Name: KnownBadInputs
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            SampledRequestsEnabled: false
            MetricName: KnownBadInputs
        - Name: AmazonIpReputation
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            SampledRequestsEnabled: false
            MetricName: AmazonIpReputation
        - Name: PerIpRateLimit
          Priority: 3
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              EvaluationWindowSec: 300
              Limit: !Ref RateLimit
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            SampledRequestsEnabled: false
            MetricName: PerIpRateLimit

  WafLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub aws-waf-logs-${AWS::StackName}
      RetentionInDays: 30

  WafLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    DependsOn: WafLogGroup
    Properties:
      ResourceArn: !GetAtt WebAcl.Arn
      LogDestinationConfigs:
        - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws-waf-logs-${AWS::StackName}
      RedactedFields:
        - SingleHeader:
            Name: authorization
        - SingleHeader:
            Name: cookie
        - QueryString: {}
      LoggingFilter:
        DefaultBehavior: DROP
        Filters:
          - Behavior: KEEP
            Requirement: MEETS_ANY
            Conditions:
              - ActionCondition:
                  Action: BLOCK

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases: !If [EnablePreviewRouting, [!Ref DomainName, !Sub '*.${DomainName}'], [!Ref DomainName]]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        WebACLId: !GetAtt WebAcl.Arn
        Origins:
          - Id: WebApp
            DomainName: !Ref WebAppOriginDomainName
            OriginCustomHeaders:
              - HeaderName: X-Forwarded-Host
                HeaderValue: !Ref DomainName
            OriginAccessControlId: !GetAtt WebAppOriginAccessControl.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: WebApp
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref DynamicCachePolicy
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations: !If
            - EnablePreviewRouting
            - - EventType: viewer-request
                FunctionARN: !GetAtt PreviewRoutingFunction.FunctionARN
            - !Ref 'AWS::NoValue'
        CacheBehaviors:
          - PathPattern: /_next/static/*
            TargetOriginId: WebApp
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref StaticCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            FunctionAssociations: !If
              - EnablePreviewRouting
              - - EventType: viewer-request
                  FunctionARN: !GetAtt PreviewRoutingFunction.FunctionARN
              - !Ref 'AWS::NoValue'
        CustomErrorResponses:
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ErrorCachingMinTTL: 0
          - ErrorCode: 500
            ErrorCachingMinTTL: 0
          - ErrorCode: 502
            ErrorCachingMinTTL: 0
          - ErrorCode: 503
            ErrorCachingMinTTL: 0
          - ErrorCode: 504
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  DomainRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: UseRoute53
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - !If
          - EnablePreviewRouting
          - Name: !Sub '*.${DomainName}'
            Type: A
            AliasTarget:
              DNSName: !GetAtt Distribution.DomainName
              HostedZoneId: Z2FDTNDATAQYW2
              EvaluateTargetHealth: false
          - !Ref 'AWS::NoValue'
        - !If
          - EnablePreviewRouting
          - Name: !Sub '*.${DomainName}'
            Type: AAAA
            AliasTarget:
              DNSName: !GetAtt Distribution.DomainName
              HostedZoneId: Z2FDTNDATAQYW2
              EvaluateTargetHealth: false
          - !Ref 'AWS::NoValue'

Outputs:
  PreviewRoutingStoreArn:
    Condition: EnablePreviewRouting
    Description: Pass this ARN to preview stacks, including stacks in other regions.
    Value: !GetAtt PreviewRoutingStore.Arn
  PreviewDomainName:
    Condition: EnablePreviewRouting
    Value: !Ref DomainName
  PreviewHostedZoneId:
    Condition: UseRoute53
    Value: !Ref HostedZoneId
  CertificateArn:
    Description: ACM certificate managed by the separate DNS/certificate stack in us-east-1.
    Value: !Ref CertificateArn
  DistributionId:
    Description: Cloudfront Distribution ID
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Cloudflare DNS-only CNAME target
    Value: !GetAtt Distribution.DomainName
  WebsiteUrl:
    Value: !Sub https://${DomainName}
  WebAclArn:
    Value: !GetAtt WebAcl.Arn
  WafLogGroupName:
    Value: !Ref WafLogGroup
