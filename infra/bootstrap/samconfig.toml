version = 0.1

[template-s3.deploy.parameters]
template_file = "template-s3.yaml"
stack_name = "sam-nextjs-slongdotexe-bootstrap-s3"
region = "ap-southeast-2"
profile = "slongdotexe"
resolve_s3 = false
no_fail_on_empty_changeset = true
confirm_changeset = false
parameter_overrides = ["RepositoryPrefix=slongdotexe"]

[ci-edge.deploy.parameters]
template_file = "template-edge.yaml"
stack_name = "sam-nextjs-slongdotexe-bootstrap-edge"
region = "us-east-1"
no_fail_on_empty_changeset = true
confirm_changeset = false
parameter_overrides = ["RepositoryPrefix=slongdotexe"]
