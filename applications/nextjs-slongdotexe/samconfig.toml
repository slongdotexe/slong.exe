# IMPORTANT: Build artifacts should be environment-agnostic.
# Only deployment parameters (stack name, Environment, LogLevel, etc.) should vary by environment.
# Use `sam build` or `sam build --config-env default` to create a portable artifact.
# Specify the target environment only at deploy time (e.g., `sam deploy --config-env production`).
#
# More information about the configuration file can be found here:
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default.global.parameters]
# stack_name is set per-environment or dynamically in CI

[default.build.parameters]
parallel = true

[default.validate.parameters]
lint = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
parameter_overrides = "Environment=development LogLevel=DEBUG"
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"

[development.deploy.parameters]
template_file = "template.yaml"
stack_name = "sam-nextjs-slongdotexe-development"
region = "ap-southeast-2"
resolve_s3 = false
no_fail_on_empty_changeset = true
confirm_changeset = false
parameter_overrides = [
	"Environment=development",
	"RuntimePermissionsBoundaryArn=arn:aws:iam::206665440523:policy/slongdotexe-development-runtime-boundary",
	"LogLevel=INFO",
	"EndpointAuthType=IamAuth",
	"RumDomainName=development.seanlong.me",
	"RumSessionSampleRate=1",
	"EnableCloudFrontAuthorization=true",
]
capabilities = "CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND"

[development-bootstrap.deploy.parameters]
template_file = "template.yaml"
stack_name = "sam-nextjs-slongdotexe-development"
region = "ap-southeast-2"
resolve_s3 = false
no_fail_on_empty_changeset = true
confirm_changeset = false
parameter_overrides = [
	"Environment=development",
	"RuntimePermissionsBoundaryArn=arn:aws:iam::206665440523:policy/slongdotexe-development-runtime-boundary",
	"LogLevel=INFO",
	"EndpointAuthType=IamAuth",
	"RumDomainName=development.seanlong.me",
	"RumSessionSampleRate=1",
	"EnableCloudFrontAuthorization=false",
]
capabilities = "CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND"

[production.deploy.parameters]
template_file = "template.yaml"
stack_name = "sam-nextjs-slongdotexe-production"
region = "ap-southeast-2"
resolve_s3 = false
no_fail_on_empty_changeset = true
confirm_changeset = false
parameter_overrides = [
	"Environment=production",
	"RuntimePermissionsBoundaryArn=arn:aws:iam::206665440523:policy/slongdotexe-production-runtime-boundary",
	"LogLevel=INFO",
	"EndpointAuthType=IamAuth",
	"EnableCloudFrontAuthorization=true",
]
capabilities = "CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND"

[production-bootstrap.deploy.parameters]
template_file = "template.yaml"
stack_name = "sam-nextjs-slongdotexe-production"
region = "ap-southeast-2"
resolve_s3 = false
no_fail_on_empty_changeset = true
confirm_changeset = false
parameter_overrides = [
	"Environment=production",
	"RuntimePermissionsBoundaryArn=arn:aws:iam::206665440523:policy/slongdotexe-production-runtime-boundary",
	"LogLevel=INFO",
	"EndpointAuthType=IamAuth",
	"EnableCloudFrontAuthorization=false",
]
capabilities = "CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND"

[preview.deploy.parameters]
template_file = "template.yaml"
resolve_s3 = false
no_fail_on_empty_changeset = true
