AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Application cache storage with direct DynamoDB tag invalidation.

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues: [development, production, ephemeral]
  CacheNamespace:
    Type: String
    AllowedPattern: '[a-zA-Z0-9_-]+'
  PreviewPrefix:
    Type: String
    Default: ''
    AllowedPattern: '(^$|[a-zA-Z0-9_/-]+/pr-)'

Conditions:
  IsProduction: !Equals [!Ref Environment, production]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt Bucket.Arn, !Sub '${Bucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  TagTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Outputs:
  BucketName:
    Value: !Ref Bucket
    Export:
      Name: !Sub ${AWS::StackName}-BucketName
  BucketArn:
    Value: !GetAtt Bucket.Arn
    Export:
      Name: !Sub ${AWS::StackName}-BucketArn
  TagTableName:
    Value: !Ref TagTable
    Export:
      Name: !Sub ${AWS::StackName}-TagTableName
  TagTableArn:
    Value: !GetAtt TagTable.Arn
    Export:
      Name: !Sub ${AWS::StackName}-TagTableArn
  CacheNamespace:
    Value: !Ref CacheNamespace
    Export:
      Name: !Sub ${AWS::StackName}-CacheNamespace
  PreviewPrefix:
    Value: !Ref PreviewPrefix
    Export:
      Name: !Sub ${AWS::StackName}-PreviewPrefix
