AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFront CDN and WAF for the NextJS Lambda Web Function; deploy in us-east-1.

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues: [development, production, ephemeral]
  WebAppOriginDomainName:
    Type: String
    Default: ''
    Description: Mainline application origin; unused for the preview-only CDN.
    AllowedPattern: '(^$|[a-zA-Z0-9.-]+\.lambda-web\.[a-z0-9-]+\.on\.aws)'
  DNSStackName:
    Type: String
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9-]*'
    Description: DNS stack in this account and us-east-1 exporting DomainName, CertificateArn, and HostedZoneId.
  CreateHostedZone:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Match the DNS stack's CreateHostedZone setting; conditions cannot evaluate imports.
  RateLimit:
    Type: Number
    Default: 2000
    MinValue: 10
    MaxValue: 2000000000
    Description: Maximum requests per viewer IP over a five-minute window (approximate).
  AppRegion:
    Type: String
    Default: ap-southeast-2
    AllowedPattern: '[a-z]{2}(-[a-z]+)+-[0-9]+'
    Description: Region receiving the preview SSM parameters; must contain the shared application stack.
  PreviewParameterPrefix:
    Type: String
    Default: /slongdotexe/ephemeral/cdn
    AllowedPattern: '/[a-zA-Z0-9_./-]+[a-zA-Z0-9_-]'

Conditions:
  UseRoute53: !Equals [!Ref CreateHostedZone, 'true']
  EnablePreviewRouting: !Equals [!Ref Environment, ephemeral]
  IsMainline: !Not [!Equals [!Ref Environment, ephemeral]]

Rules:
  MainlineOrigin:
    RuleCondition: !Not [!Equals [!Ref Environment, ephemeral]]
    Assertions:
      - Assert: !Not [!Equals [!Ref WebAppOriginDomainName, '']]
        AssertDescription: Mainline distributions require an application origin.

Resources:
  PreviewRoutingStore:
    Type: AWS::CloudFront::KeyValueStore
    Condition: EnablePreviewRouting
    Properties:
      Name: !Sub ${AWS::StackName}-preview-routing

  RoutingConfigurationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Condition: EnablePreviewRouting
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-routing-configuration
      RetentionInDays: 30

  RoutingConfigurationRole:
    Type: AWS::IAM::Role
    Condition: EnablePreviewRouting
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: routing-configuration
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudfront-keyvaluestore:DescribeKeyValueStore
                  - cloudfront-keyvaluestore:GetKey
                  - cloudfront-keyvaluestore:PutKey
                  - cloudfront-keyvaluestore:DeleteKey
                Resource: !GetAtt PreviewRoutingStore.Arn
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:PutParameter, ssm:DeleteParameter]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AppRegion}:${AWS::AccountId}:parameter${PreviewParameterPrefix}/owner'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AppRegion}:${AWS::AccountId}:parameter${PreviewParameterPrefix}/distribution-id'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AppRegion}:${AWS::AccountId}:parameter${PreviewParameterPrefix}/routing-store-arn'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AppRegion}:${AWS::AccountId}:parameter${PreviewParameterPrefix}/preview-domain'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt RoutingConfigurationLogGroup.Arn

  RoutingConfigurationFunction:
    Type: AWS::Lambda::Function
    Condition: EnablePreviewRouting
    Properties:
      FunctionName: !Sub ${AWS::StackName}-routing-configuration
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt RoutingConfigurationRole.Arn
      Timeout: 120
      MemorySize: 256
      Code: out/preview-routing-resource/
      LoggingConfig:
        LogGroup: !Ref RoutingConfigurationLogGroup

  RoutingConfiguration:
    Type: Custom::RoutingConfiguration
    Condition: EnablePreviewRouting
    Properties:
      ServiceToken: !GetAtt RoutingConfigurationFunction.Arn
      ServiceTimeout: 180
      StoreArn: !GetAtt PreviewRoutingStore.Arn
      Hostname: config:preview-domain
      DomainName:
        Fn::ImportValue: !Sub ${DNSStackName}-DomainName
      RevisionId:
        Fn::ImportValue: !Sub ${DNSStackName}-DomainName

  PreviewParameters:
    Type: Custom::PreviewParameters
    Condition: EnablePreviewRouting
    Properties:
      ServiceToken: !GetAtt RoutingConfigurationFunction.Arn
      ServiceTimeout: 180
      TargetRegion: !Ref AppRegion
      ParameterPrefix: !Ref PreviewParameterPrefix
      DistributionId: !Ref Distribution
      StoreArn: !GetAtt PreviewRoutingStore.Arn
      DomainName:
        Fn::ImportValue: !Sub ${DNSStackName}-DomainName

  PreviewRoutingFunction:
    Type: AWS::CloudFront::Function
    Condition: EnablePreviewRouting
    DependsOn: RoutingConfiguration
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [E3003]
    Properties:
      Name: !Sub ${AWS::StackName}-preview-routing
      AutoPublish: true
      FunctionConfig:
        Comment: Route registered preview hostnames to pinned Web Function endpoints.
        Runtime: cloudfront-js-2.0
        KeyValueStoreAssociations:
          - KeyValueStoreARN: !GetAtt PreviewRoutingStore.Arn
      Fn::Transform:
        Name: AWS::Include
        Parameters:
          Location: out/cloudfront-function/code.json

  WebAppOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-web
        OriginAccessControlOriginType: lambda
        SigningBehavior: always-amz-auth
        SigningProtocol: sigv4

  DynamicCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${AWS::StackName}-dynamic
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: false
          EnableAcceptEncodingGzip: false
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  StaticCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${AWS::StackName}-static
        MinTTL: 0
        DefaultTTL: 31536000
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: !If [EnablePreviewRouting, whitelist, none]
            Headers: !If [EnablePreviewRouting, [x-preview-cache-key], !Ref 'AWS::NoValue']
          QueryStringsConfig:
            QueryStringBehavior: none

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-security
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: SAMEORIGIN
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
            Override: true

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        SampledRequestsEnabled: false
        MetricName: !Sub ${AWS::StackName}-waf
      Rules:
        - Name: CommonRuleSet
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            SampledRequestsEnabled: false
            MetricName: CommonRuleSet
        - Name: KnownBadInputs
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            SampledRequestsEnabled: false
            MetricName: KnownBadInputs
        - Name: AmazonIpReputation
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            SampledRequestsEnabled: false
            MetricName: AmazonIpReputation
        - Name: PerIpRateLimit
          Priority: 3
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              EvaluationWindowSec: 300
              Limit: !Ref RateLimit
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            SampledRequestsEnabled: false
            MetricName: PerIpRateLimit

  WafLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub aws-waf-logs-${AWS::StackName}
      RetentionInDays: 30

  WafLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    DependsOn: WafLogGroup
    Properties:
      ResourceArn: !GetAtt WebAcl.Arn
      LogDestinationConfigs:
        - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws-waf-logs-${AWS::StackName}
      RedactedFields:
        - SingleHeader:
            Name: authorization
        - SingleHeader:
            Name: cookie
        - QueryString: {}
      LoggingFilter:
        DefaultBehavior: DROP
        Filters:
          - Behavior: KEEP
            Requirement: MEETS_ANY
            Conditions:
              - ActionCondition:
                  Action: BLOCK

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases: !If
          - EnablePreviewRouting
          - - !Join
              - ''
              - - '*.'
                - Fn::ImportValue: !Sub ${DNSStackName}-DomainName
          - - Fn::ImportValue: !Sub ${DNSStackName}-DomainName
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        WebACLId: !GetAtt WebAcl.Arn
        Origins:
          - Id: WebApp
            DomainName: !If [IsMainline, !Ref WebAppOriginDomainName, preview.invalid]
            OriginCustomHeaders:
              - HeaderName: X-Forwarded-Host
                HeaderValue:
                  Fn::ImportValue: !Sub ${DNSStackName}-DomainName
            OriginAccessControlId: !If [IsMainline, !GetAtt WebAppOriginAccessControl.Id, !Ref 'AWS::NoValue']
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: WebApp
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref DynamicCachePolicy
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations: !If
            - EnablePreviewRouting
            - - EventType: viewer-request
                FunctionARN: !GetAtt PreviewRoutingFunction.FunctionARN
            - !Ref 'AWS::NoValue'
        CacheBehaviors:
          - PathPattern: /_next/static/*
            TargetOriginId: WebApp
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref StaticCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            FunctionAssociations: !If
              - EnablePreviewRouting
              - - EventType: viewer-request
                  FunctionARN: !GetAtt PreviewRoutingFunction.FunctionARN
              - !Ref 'AWS::NoValue'
        CustomErrorResponses:
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ErrorCachingMinTTL: 0
          - ErrorCode: 500
            ErrorCachingMinTTL: 0
          - ErrorCode: 502
            ErrorCachingMinTTL: 0
          - ErrorCode: 503
            ErrorCachingMinTTL: 0
          - ErrorCode: 504
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          AcmCertificateArn:
            Fn::ImportValue: !Sub ${DNSStackName}-CertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  DomainRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: UseRoute53
    Properties:
      HostedZoneId:
        Fn::ImportValue: !Sub ${DNSStackName}-HostedZoneId
      RecordSets:
        - !If
          - EnablePreviewRouting
          - !Ref 'AWS::NoValue'
          - Name:
              Fn::ImportValue: !Sub ${DNSStackName}-DomainName
            Type: A
            AliasTarget:
              DNSName: !GetAtt Distribution.DomainName
              HostedZoneId: Z2FDTNDATAQYW2
              EvaluateTargetHealth: false
        - !If
          - EnablePreviewRouting
          - !Ref 'AWS::NoValue'
          - Name:
              Fn::ImportValue: !Sub ${DNSStackName}-DomainName
            Type: AAAA
            AliasTarget:
              DNSName: !GetAtt Distribution.DomainName
              HostedZoneId: Z2FDTNDATAQYW2
              EvaluateTargetHealth: false
        - !If
          - EnablePreviewRouting
          - Name: !Join
              - ''
              - - '*.'
                - Fn::ImportValue: !Sub ${DNSStackName}-DomainName
            Type: A
            AliasTarget:
              DNSName: !GetAtt Distribution.DomainName
              HostedZoneId: Z2FDTNDATAQYW2
              EvaluateTargetHealth: false
          - !Ref 'AWS::NoValue'
        - !If
          - EnablePreviewRouting
          - Name: !Join
              - ''
              - - '*.'
                - Fn::ImportValue: !Sub ${DNSStackName}-DomainName
            Type: AAAA
            AliasTarget:
              DNSName: !GetAtt Distribution.DomainName
              HostedZoneId: Z2FDTNDATAQYW2
              EvaluateTargetHealth: false
          - !Ref 'AWS::NoValue'

Outputs:
  PreviewDomainName:
    Condition: EnablePreviewRouting
    Description: Base hostname for PR routes on the ephemeral CDN.
    Value:
      Fn::ImportValue: !Sub ${DNSStackName}-DomainName
  PreviewRoutingStoreArn:
    Condition: EnablePreviewRouting
    Description: Pass this ARN to preview stacks, including stacks in other regions.
    Value: !GetAtt PreviewRoutingStore.Arn
  DistributionId:
    Description: Cloudfront Distribution ID
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Cloudflare DNS-only CNAME target
    Value: !GetAtt Distribution.DomainName
  WebsiteUrl:
    Condition: IsMainline
    Value: !Join
      - ''
      - - https://
        - Fn::ImportValue: !Sub ${DNSStackName}-DomainName
  WebAclArn:
    Value: !GetAtt WebAcl.Arn
  WafLogGroupName:
    Value: !Ref WafLogGroup
