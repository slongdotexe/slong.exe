AWSTemplateFormatVersion: '2010-09-09'
Description: Regional artifact storage for CloudFront deployment code in us-east-1.
Parameters:
  RepositoryPrefix:
    Type: String
    Default: slongdotexe
    AllowedPattern: '[a-z][a-z0-9-]{0,24}[a-z0-9]'
Resources:
  Artifacts:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${RepositoryPrefix}-artifacts-${AWS::AccountId}-us-east-1'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: CleanOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
  ArtifactsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Artifacts
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt Artifacts.Arn, !Sub '${Artifacts.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
Outputs:
  ArtifactBucket:
    Value: !Ref Artifacts
