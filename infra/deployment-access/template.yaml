AWSTemplateFormatVersion: '2010-09-09'
Description: Repository GitHub OIDC and environment-isolated deployment roles using externally managed artifact storage.

Parameters:
  Artifacts:
    Type: String
    Description: Regional artifact bucket owned by the template-s3 stack.
    AllowedPattern: '[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'
  GitHubOwner:
    Type: String
    AllowedPattern: '[A-Za-z0-9-]+'
  GitHubRepository:
    Type: String
    AllowedPattern: '[A-Za-z0-9_.-]+'
  GitHubOwnerId:
    Type: String
    AllowedPattern: '[0-9]+'
  GitHubRepositoryId:
    Type: String
    AllowedPattern: '[0-9]+'
  RepositoryPrefix:
    Type: String
    Default: slongdotexe
    AllowedPattern: '[a-z][a-z0-9-]{0,24}[a-z0-9]'
    Description: Namespace for repository-owned deployment roles, policies, and artifact paths.
  ApplicationResourcePrefix:
    Type: String
    Default: sam-*-slongdotexe
    AllowedPattern: '[a-z][a-z0-9*-]{0,62}'
    Description: IAM glob for application resource prefixes and Project tags; never used in shared resource names.
  DevelopmentRecordNames:
    Type: CommaDelimitedList
    Default: 'development.seanlong.me,*.development.seanlong.me,_*.development.seanlong.me'
    Description: Explicit DNS record-name allowlist for nonproduction applications; include wildcard and validation records where needed.
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|arn:[a-z-]+:iam::[0-9]{12}:oidc-provider/token.actions.githubusercontent.com'

Conditions:
  CreateGitHubOidcProvider: !Equals [ !Ref ExistingGitHubOidcProviderArn, '' ]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [ sts.amazonaws.com ]

  developmentRuntimePermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: !Sub '${RepositoryPrefix}-development-runtime-boundary'
      Description: Maximum application runtime permissions within the application namespace and environment.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [ s3:GetObject, s3:PutObject ]
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${ApplicationResourcePrefix}-development-*/${ApplicationResourcePrefix}-development/*'
              - !Sub 'arn:${AWS::Partition}:s3:::${ApplicationResourcePrefix}-development-*/${ApplicationResourcePrefix}-development-*/*'
          - Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${ApplicationResourcePrefix}-development-*'
            Condition:
              StringLike:
                s3:prefix:
                  - !Sub '${ApplicationResourcePrefix}-development/*'
                  - !Sub '${ApplicationResourcePrefix}-development-*/*'
          - Effect: Allow
            Action: [ dynamodb:GetItem, dynamodb:UpdateItem ]
            Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ApplicationResourcePrefix}-development-*'
            Condition:
              ForAllValues:StringLike:
                dynamodb:LeadingKeys:
                  - !Sub '${ApplicationResourcePrefix}-development#tag#*'
                  - !Sub '${ApplicationResourcePrefix}-development-*#tag#*'
          - Effect: Allow
            Action: [ logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents ]
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ApplicationResourcePrefix}-development-*:*'
          - Effect: Allow
            Action: rum:PutRumEvents
            Resource: !Sub 'arn:${AWS::Partition}:rum:${AWS::Region}:${AWS::AccountId}:appmonitor/${ApplicationResourcePrefix}-development-*'
          - Effect: Allow
            Action: xray:PutTraceSegments
            Resource: '*'

  developmentApplicationDeploymentPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${RepositoryPrefix}-development-app-deployment-policy'
      Description: CloudFormation application lifecycle permissions within the application namespace and environment.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SamTransform
            Effect: Allow
            Action: cloudformation:CreateChangeSet
            Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
          - Sid: PassNestedStackExecutionRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RepositoryPrefix}-development-app-execution'
            Condition:
              StringEquals:
                iam:PassedToService: cloudformation.amazonaws.com
          - Sid: NestedCacheStack
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:GetTemplate
            Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApplicationResourcePrefix}-development-*/*'
          - Sid: CacheBucketLifecycle
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:GetBucketLocation
              - s3:GetBucketPolicy
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:GetEncryptionConfiguration
              - s3:PutEncryptionConfiguration
              - s3:GetBucketPublicAccessBlock
              - s3:PutBucketPublicAccessBlock
              - s3:GetBucketTagging
              - s3:PutBucketTagging
              - s3:GetBucketVersioning
              - s3:GetBucketAcl
              - s3:GetBucketOwnershipControls
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${ApplicationResourcePrefix}-development-*'
          - Sid: CacheTableLifecycle
            Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:UpdateTable
              - dynamodb:DeleteTable
              - dynamodb:DescribeTable
              - dynamodb:DescribeContinuousBackups
              - dynamodb:UpdateContinuousBackups
              - dynamodb:ListTagsOfResource
              - dynamodb:TagResource
              - dynamodb:UntagResource
            Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ApplicationResourcePrefix}-development-*'
          - Sid: CreateBoundedRuntimeRoles
            Effect: Allow
            Action: [ iam:CreateRole, iam:PutRolePermissionsBoundary ]
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationResourcePrefix}-development-*WebAppRole-*'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationResourcePrefix}-development-*RumGuestRole-*'
            Condition:
              ArnEquals:
                iam:PermissionsBoundary: !Ref developmentRuntimePermissionsBoundary
          - Sid: RuntimeRoleLifecycle
            Effect: Allow
            Action:
              - iam:GetRole
              - iam:DeleteRole
              - iam:DeleteRolePermissionsBoundary
              - iam:UpdateAssumeRolePolicy
              - iam:GetRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:TagRole
              - iam:UntagRole
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationResourcePrefix}-development-*WebAppRole-*'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationResourcePrefix}-development-*RumGuestRole-*'
          - Sid: PassWebRuntimeRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationResourcePrefix}-development-*WebAppRole-*'
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com
          - Sid: WebFunctionLifecycle
            Effect: Allow
            Action:
              - lambda:CreateWebFunction
              - lambda:GetWebFunction
              - lambda:DeleteWebFunction
              - lambda:CreateWebFunctionRevision
              - lambda:GetWebFunctionRevision
              - lambda:DeleteWebFunctionRevision
              - lambda:CreateWebFunctionEndpoint
              - lambda:GetWebFunctionEndpoint
              - lambda:UpdateWebFunctionEndpoint
              - lambda:DeleteWebFunctionEndpoint
              - lambda:GetResourcePolicy
              - lambda:PutResourcePolicy
              - lambda:DeleteResourcePolicy
              - lambda:ListTags
              - lambda:TagResource
              - lambda:UntagResource
            Resource:
              - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/${ApplicationResourcePrefix}-development-*'
          - Sid: ApplicationLogGroups
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:DeleteRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
              - logs:ListTagsForResource
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ApplicationResourcePrefix}-development-*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ApplicationResourcePrefix}-development-*:*'
          - Sid: LogGroupDiscovery
            Effect: Allow
            Action: logs:DescribeLogGroups
            Resource: '*'
          - Sid: CdnParameterResolution
            Effect: Allow
            Action: [ ssm:GetParameter, ssm:GetParameters ]
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${RepositoryPrefix}/development/*'
          - Sid: RumMonitorLifecycle
            Effect: Allow
            Action:
              - rum:CreateAppMonitor
              - rum:GetAppMonitor
              - rum:ListRumMetricsDestinations
              - rum:BatchGetRumMetricDefinitions
              - rum:GetResourcePolicy
              - rum:UpdateAppMonitor
              - rum:DeleteAppMonitor
              - rum:ListTagsForResource
              - rum:TagResource
              - rum:UntagResource
            Resource: !Sub 'arn:${AWS::Partition}:rum:${AWS::Region}:${AWS::AccountId}:appmonitor/${ApplicationResourcePrefix}-development-*'
          - Sid: CognitoIdentityPoolLifecycle
            Effect: Allow
            Action:
              - cognito-identity:CreateIdentityPool
              - cognito-identity:DescribeIdentityPool
              - cognito-identity:UpdateIdentityPool
              - cognito-identity:DeleteIdentityPool
              - cognito-identity:GetIdentityPoolRoles
              - cognito-identity:SetIdentityPoolRoles
              - cognito-identity:ListTagsForResource
              - cognito-identity:TagResource
              - cognito-identity:UntagResource
            Resource: !Sub 'arn:${AWS::Partition}:cognito-identity:${AWS::Region}:${AWS::AccountId}:identitypool/*'

  developmentCloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${RepositoryPrefix}-development-app-execution'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref developmentApplicationDeploymentPolicy
      Policies:
        - PolicyName: ReadApplicationArtifacts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${Artifacts}/${RepositoryPrefix}/development/*'

  developmentPipelineExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${RepositoryPrefix}-development-app-deploy'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:environment:development'
      Policies:
        - PolicyName: DeployApplication
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CreateApplicationChangeSet
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApplicationResourcePrefix}-development/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApplicationResourcePrefix}-development-*/*'
                Condition:
                  ArnEquals:
                    cloudformation:RoleArn: !GetAtt developmentCloudFormationExecutionRole.Arn
              - Sid: ApplicationStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApplicationResourcePrefix}-development/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApplicationResourcePrefix}-development-*/*'
              - Sid: PassOnlyCloudFormationRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt developmentCloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: ArtifactBucketMetadata
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetBucketVersioning
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${Artifacts}'
              - Sid: ListApplicationArtifacts
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${Artifacts}'
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub '${RepositoryPrefix}/development'
                      - !Sub '${RepositoryPrefix}/development/*'
              - Sid: ApplicationArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${Artifacts}/${RepositoryPrefix}/development/*'
  productionRuntimePermissionsBoundary:
