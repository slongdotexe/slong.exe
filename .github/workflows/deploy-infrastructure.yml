name: "Manual: Deploy CDN"
run-name: >-
  Manual: Deploy CDN | ${{ inputs.environment }} | ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: CDN target
        type: choice
        options: [development, production, preview-infrastructure]
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-cdn-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-cdn.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      TARGET: ${{ inputs.environment == 'preview-infrastructure' && 'ephemeral' || inputs.environment }}
      APP_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      EXECUTION_ROLE: ${{ vars.AWS_INFRA_CLOUDFORMATION_ROLE_ARN }}
      ARTIFACT_BUCKET: ${{ vars.AWS_INFRA_ARTIFACT_BUCKET }}
      ARTIFACT_PREFIX: ${{ vars.AWS_INFRA_ARTIFACT_PREFIX }}
      RUNTIME_BOUNDARY: ${{ vars.AWS_INFRA_RUNTIME_PERMISSIONS_BOUNDARY_ARN }}
      AWS_PAGER: ""
    steps:
      - name: Download CDN artifact
        uses: actions/download-artifact@v4
        with:
          name: cdn
          path: ${{ runner.temp }}

      - name: Unpack deployment ZIP
        run: unzip -q "$RUNNER_TEMP/cdn.zip" -d "$RUNNER_TEMP/cdn"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Look up application origin
        if: inputs.environment != 'preview-infrastructure'
        id: origin
        run: |
          origin=$(
            aws cloudformation describe-stacks \
              --stack-name "sam-nextjs-slongdotexe-$TARGET" \
              --region "$APP_REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='WebAppOriginDomainName'].OutputValue | [0]" \
              --output text
          )
          [[ -n "$origin" && "$origin" != None ]]
          echo "domain=$origin" >> "$GITHUB_OUTPUT"

      - name: Deploy mainline CDN
        if: inputs.environment != 'preview-infrastructure'
        working-directory: ${{ runner.temp }}/cdn
        env:
          ORIGIN_DOMAIN: ${{ steps.origin.outputs.domain }}
          CREATE_HOSTED_ZONE: ${{ inputs.environment == 'development' }}
        run: |
          sam deploy \
            --config-env "$TARGET" \
            --region us-east-1 \
            --role-arn "$EXECUTION_ROLE" \
            --s3-bucket "$ARTIFACT_BUCKET" \
            --s3-prefix "$ARTIFACT_PREFIX" \
            --parameter-overrides \
              "InfrastructureRuntimePermissionsBoundaryArn=$RUNTIME_BOUNDARY" \
              "Environment=$TARGET" \
              "AppRegion=$APP_REGION" \
              "WebAppOriginDomainName=$ORIGIN_DOMAIN" \
              "DNSStackName=sam-nextjs-slongdotexe-$TARGET-dns" \
              "CreateHostedZone=$CREATE_HOSTED_ZONE"

      - name: Deploy shared preview CDN
        if: inputs.environment == 'preview-infrastructure'
        working-directory: ${{ runner.temp }}/cdn
        run: sam deploy --config-env "$TARGET" --region us-east-1 \
          --role-arn "$EXECUTION_ROLE" \
          --s3-bucket "$ARTIFACT_BUCKET" \
          --s3-prefix "$ARTIFACT_PREFIX" \
          --parameter-overrides \
          "InfrastructureRuntimePermissionsBoundaryArn=$RUNTIME_BOUNDARY" \
          "Environment=$TARGET" "AppRegion=$APP_REGION" \
          DNSStackName=sam-nextjs-slongdotexe-development-dns \
          CreateHostedZone=true \
          PreviewParameterPrefix=/slongdotexe/ephemeral/cdn

      - name: Summarize application authorization follow-up
        if: inputs.environment != 'preview-infrastructure'
        run: |
          printf 'Run Manual: Deploy Application with bootstrap disabled to resolve the CDN parameter and update origin authorization.\n' \
          >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize CDN outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "sam-nextjs-slongdotexe-$TARGET-cdn" \
            --region us-east-1 \
            --query 'Stacks[0].Outputs' \
            --output table \
            >> "$GITHUB_STEP_SUMMARY"
