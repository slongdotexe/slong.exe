name: Deploy PR Preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number
        type: number
        required: true
      operation:
        description: Preview operation
        type: choice
        options: [deploy, delete]
        required: true

permissions:
  contents: read

jobs:
  build:
    if: inputs.operation == 'deploy'
    uses: ./.github/workflows/build-application.yml
    with:
      sha: ${{ format('refs/pull/{0}/head', inputs.pr_number) }}

  preview:
    needs: build
    if: ${{ always() && !cancelled() && (inputs.operation == 'delete' || needs.build.result == 'success') }}
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/deploy-preview.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      build_run_id: ${{ needs.build.outputs.run-id }}
      operation: ${{ inputs.operation }}
