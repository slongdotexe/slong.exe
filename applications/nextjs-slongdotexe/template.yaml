AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Isolated development or production NextJS application and shared development preview infrastructure.

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues: [development, production]
  LogLevel:
    Type: String
    Default: INFO
  ApplicationPath:
    Type: String
    Default: applications/nextjs-slongdotexe
  EndpointName:
    Type: String
    Default: prod
    AllowedPattern: '[a-zA-Z0-9_-]{1,64}'
    Description: Stable endpoint name. Keep prod for existing stacks; changing it replaces the origin hostname.
  CloudFrontDistributionId:
    Type: String
    Default: ''
    AllowedPattern: '(^$|E[A-Z0-9]+)'
    Description: CDN DistributionId output. When set, only that distribution can invoke the web endpoint.
  RumDomainName:
    Type: String
    Default: ''
    AllowedPattern: '(^$|[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+)'
    Description: Public browser hostname without scheme or path. Leave empty to disable RUM.
  RumSessionSampleRate:
    Type: Number
    Default: 0.1
    MinValue: 0
    MaxValue: 1
Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  IsDevelopment: !Equals [!Ref Environment, development]
  UseCloudFront: !Not [!Equals [!Ref CloudFrontDistributionId, '']]
  EnableRum: !Not [!Equals [!Ref RumDomainName, '']]

Resources:
  RumIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Condition: EnableRum
    Properties:
      AllowUnauthenticatedIdentities: true

  RumGuestRole:
    Type: AWS::IAM::Role
    Condition: EnableRum
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref RumIdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: unauthenticated
      Policies:
        - PolicyName: rum-publish-events
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rum:PutRumEvents
                Resource: !Sub arn:${AWS::Partition}:rum:${AWS::Region}:${AWS::AccountId}:appmonitor/${AWS::StackName}-rum

  RumIdentityPoolRoles:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Condition: EnableRum
    Properties:
      IdentityPoolId: !Ref RumIdentityPool
      Roles:
        unauthenticated: !GetAtt RumGuestRole.Arn

  RumAppMonitor:
    Type: AWS::RUM::AppMonitor
    Condition: EnableRum
    Properties:
      Name: !Sub ${AWS::StackName}-rum
      Domain: !Ref RumDomainName
      CwLogEnabled: false
      AppMonitorConfiguration:
        IdentityPoolId: !Ref RumIdentityPool
        GuestRoleArn: !GetAtt RumGuestRole.Arn
        AllowCookies: false
        EnableXRay: false
        SessionSampleRate: !Ref RumSessionSampleRate
        Telemetries: [errors, performance, http]

  IncrementalCacheBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  IncrementalCacheBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref IncrementalCacheBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt IncrementalCacheBucket.Arn
              - !Sub ${IncrementalCacheBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  CacheTagTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  CacheRevalidationDeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      FifoQueue: true
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  CacheRevalidationQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      FifoQueue: true
      SqsManagedSseEnabled: true
      # At least six times the consumer timeout.
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CacheRevalidationDeadLetterQueue.Arn
        maxReceiveCount: 5

  CacheRevalidationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-cache-revalidation
      RetentionInDays: 90

  CacheRevalidationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cache-revalidation-consumer
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt CacheRevalidationQueue.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt CacheRevalidationLogGroup.Arn
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt CacheTagTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - !Sub '${AWS::StackName}#tag#*'
                      - !If [IsDevelopment, !Sub '${AWS::StackName}/previews/pr-*#tag#*', !Ref 'AWS::NoValue']

  CacheRevalidationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-cache-revalidation
      Runtime: nodejs24.x
      CodeUri: out/web-function/
      Handler: !Sub ${ApplicationPath}/src/cache/worker.handler
      Role: !GetAtt CacheRevalidationRole.Arn
      Timeout: 30
      MemorySize: 256
      LoggingConfig:
        LogGroup: !Ref CacheRevalidationLogGroup
      Environment:
        Variables:
          CACHE_TABLE_NAME: !Ref CacheTagTable
          CACHE_KEY_PREFIX: !Ref AWS::StackName
          CACHE_PREVIEW_PREFIX: !If [IsDevelopment, !Sub '${AWS::StackName}/previews/pr-', !Ref 'AWS::NoValue']
      Events:
        Revalidate:
          Type: SQS
          Properties:
            Queue: !GetAtt CacheRevalidationQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 5

  # CacheRevalidationDeadLetterAlarm:
  #   Type: AWS::CloudWatch::Alarm
  #   Properties:
  #     AlarmDescription: Cache revalidation exhausted retries; inspect and redrive the FIFO DLQ.
  #     Namespace: AWS/SQS
  #     MetricName: ApproximateNumberOfMessagesVisible
  #     Dimensions:
  #       - Name: QueueName
  #         Value: !GetAtt CacheRevalidationDeadLetterQueue.QueueName
  #     Statistic: Maximum
  #     Period: 60
  #     EvaluationPeriods: 1
  #     Threshold: 0
  #     ComparisonOperator: GreaterThanThreshold
  #     TreatMissingData: notBreaching

  WebAppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: aurora-starter-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                # Web Functions write locally before centralizing, even in HomeRegion.
                Resource:
                  - !GetAtt WebAppLogGroup.Arn
                  - !GetAtt WebAppLocalLogGroup.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${IncrementalCacheBucket.Arn}/${AWS::StackName}/*
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt CacheTagTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - !Sub '${AWS::StackName}#tag#*'
                      - !If [IsDevelopment, !Sub '${AWS::StackName}/previews/pr-*#tag#*', !Ref 'AWS::NoValue']
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt CacheRevalidationQueue.Arn
              - Effect: Allow
                Action: xray:PutTraceSegments
                Resource: '*'

  WebAppLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-web
      RetentionInDays: 90

  WebAppLocalLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      LogGroupName: !Sub ${WebAppLogGroup}.local
      RetentionInDays: 90

  WebAppFunction:
    Type: AWS::Serverless::WebFunction
    Properties:
      # Web Function names are account-wide, so include the region as well as the stack.
      FunctionName: !Sub ${AWS::StackName}-${AWS::Region}-web
      Runtime: nodejs24.x
      CodeUri: out/web-function/
      EntryPoint: !Sub ${ApplicationPath}/server.js
      AuthType: !If [UseCloudFront, IamAuth, ApplicationManaged]
      EndpointName: !Ref EndpointName
      EndpointType: HomeRegion
      AutoDeploymentMode: LatestRevision
      ExecutionRoleArn: !GetAtt WebAppRole.Arn
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref WebAppLogGroup
        ApplicationLogLevel: !Ref LogLevel
        SystemLogLevel: INFO
      EnvironmentVariables:
        NODE_OPTIONS: !Sub --import ./${ApplicationPath}/web-function-entrypoint.mts
        OTEL_SERVICE_NAME: !Sub ${AWS::StackName}-web
        OTEL_METRICS_EXPORTER: none
        OTEL_LOGS_EXPORTER: none
        OTEL_TRACES_EXPORTER: otlp
        OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: !Sub https://xray.${AWS::Region}.amazonaws.com/v1/traces
        OTEL_TRACES_SAMPLER: !If [IsProduction, parentbased_traceidratio, !Ref 'AWS::NoValue']
        OTEL_TRACES_SAMPLER_ARG: !If [IsProduction, '0.05', !Ref 'AWS::NoValue']
        OTEL_RESOURCE_ATTRIBUTES: !Sub 'deployment.environment.name=${Environment},cloud.region=${AWS::Region}'
        CACHE_BUCKET_NAME: !Ref IncrementalCacheBucket
        CACHE_TABLE_NAME: !Ref CacheTagTable
        CACHE_KEY_PREFIX: !Ref AWS::StackName
        CACHE_REVALIDATION_QUEUE_URL: !Ref CacheRevalidationQueue
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !Ref LogLevel
        RUM_APP_MONITOR_ID: !If [EnableRum, !GetAtt RumAppMonitor.Id, !Ref 'AWS::NoValue']
        RUM_IDENTITY_POOL_ID: !If [EnableRum, !Ref RumIdentityPool, !Ref 'AWS::NoValue']
        RUM_REGION: !If [EnableRum, !Ref 'AWS::Region', !Ref 'AWS::NoValue']
        RUM_SESSION_SAMPLE_RATE: !Sub '${RumSessionSampleRate}'
      Tags:
        Environment: !Ref Environment

  WebAppCloudFrontPolicy:
    Type: AWS::Lambda::ResourcePolicy
    Condition: UseCloudFront
    Properties:
      ResourceArn: !Ref WebAppFunction
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: lambda:InvokeWebFunctionEndpoint
            Resource: !Sub ${WebAppFunction}/endpoint/${EndpointName}
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}

Outputs:
  RumAppMonitorName:
    Condition: EnableRum
    Value: !Ref RumAppMonitor
  RumAppMonitorId:
    Condition: EnableRum
    Value: !GetAtt RumAppMonitor.Id
  RumIdentityPoolId:
    Condition: EnableRum
    Value: !Ref RumIdentityPool
  WebAppFunctionArn:
    Value: !Ref WebAppFunction
  WebAppEndpointName:
    Value: !Ref EndpointName
  WebAppOriginDomainName:
    Description: Regional CloudFront origin hostname, without scheme or path.
    Value: !GetAtt WebAppFunctionEndpoint.DomainName
  IncrementalCacheBucketName:
    Value: !Ref IncrementalCacheBucket
  CacheTagTableName:
    Value: !Ref CacheTagTable
  CacheRevalidationQueueUrl:
    Value: !Ref CacheRevalidationQueue
  CacheRevalidationDeadLetterQueueUrl:
    Value: !Ref CacheRevalidationDeadLetterQueue
  WebAppUrl:
    Value: !Sub https://${WebAppFunctionEndpoint.DomainName}
  WebAppLogGroupName:
    Value: !Ref WebAppLogGroup
  WebAppLocalLogGroupName:
    Description: Regional logs available before centralization completes.
    Value: !Ref WebAppLocalLogGroup
  PreviewCacheBucketName:
    Condition: IsDevelopment
    Value: !Ref IncrementalCacheBucket
    Export:
      Name: !Sub ${AWS::StackName}-PreviewCacheBucketName
  PreviewCacheBucketArn:
    Condition: IsDevelopment
    Value: !GetAtt IncrementalCacheBucket.Arn
    Export:
      Name: !Sub ${AWS::StackName}-PreviewCacheBucketArn
  PreviewCacheTagTableName:
    Condition: IsDevelopment
    Value: !Ref CacheTagTable
    Export:
      Name: !Sub ${AWS::StackName}-PreviewCacheTagTableName
  PreviewCacheTagTableArn:
    Condition: IsDevelopment
    Value: !GetAtt CacheTagTable.Arn
    Export:
      Name: !Sub ${AWS::StackName}-PreviewCacheTagTableArn
  PreviewWebFunctionArn:
    Condition: IsDevelopment
    Value: !Ref WebAppFunction
    Export:
      Name: !Sub ${AWS::StackName}-PreviewWebFunctionArn
  PreviewRuntimeRoleArn:
    Condition: IsDevelopment
    Value: !GetAtt WebAppRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-PreviewRuntimeRoleArn
  PreviewWebLogGroupName:
    Condition: IsDevelopment
    Value: !Ref WebAppLogGroup
    Export:
      Name: !Sub ${AWS::StackName}-PreviewWebLogGroupName
  PreviewRevalidationQueueUrl:
    Condition: IsDevelopment
    Value: !Ref CacheRevalidationQueue
    Export:
      Name: !Sub ${AWS::StackName}-PreviewRevalidationQueueUrl
